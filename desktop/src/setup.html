<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>VibeWorks</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font: 14px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #e9e7ff;
        background: radial-gradient(1200px 600px at 20% -10%, #3b1d6e 0%, transparent 60%),
                    radial-gradient(900px 500px at 110% 110%, #5b1d4f 0%, transparent 55%), #06061a;
      }
      .card {
        width: 100%; max-width: 440px; padding: 28px; border-radius: 20px;
        background: rgba(20, 18, 48, 0.72); border: 1px solid rgba(167, 139, 250, 0.25);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); backdrop-filter: blur(12px);
      }
      .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .logo svg { width: 44px; height: 44px; }
      .logo b { font-size: 20px; letter-spacing: 0.2px; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { margin: 0 0 16px; color: #b9b5dd; }
      label { display: block; font-size: 12px; font-weight: 600; color: #cfcaf5; margin-bottom: 6px; }
      input {
        width: 100%; padding: 11px 12px; border-radius: 12px; font: inherit; color: inherit;
        background: rgba(6, 6, 26, 0.7); border: 1px solid rgba(167, 139, 250, 0.3); outline: none;
      }
      input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25); }
      .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
      button {
        padding: 10px 16px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer;
        border: 1px solid rgba(167, 139, 250, 0.35); background: rgba(167, 139, 250, 0.12); color: inherit;
      }
      button.primary { background: linear-gradient(135deg, #8b5cf6, #d946ef); border-color: transparent; color: #fff; }
      button:disabled { opacity: 0.6; cursor: default; }
      .error { color: #fca5a5; margin-top: 12px; min-height: 1.5em; }
      .hint { font-size: 12px; color: #8f8ab8; margin-top: 14px; }
      code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; color: #e9d5ff; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="vw" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a78bfa" /><stop offset=".5" stop-color="#ec4899" /><stop offset="1" stop-color="#22d3ee" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="#0b0a1f" />
          <path d="M13 20 L25 46 L32 31 L39 46 L51 20" fill="none" stroke="url(#vw)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="51" cy="13" r="3" fill="#fff" opacity=".9" />
        </svg>
        <b>VibeWorks</b>
      </div>

      <section id="setup">
        <h1 id="t-title"></h1>
        <p id="t-text"></p>
        <form id="form">
          <label for="url" id="t-label"></label>
          <input id="url" autocomplete="url" spellcheck="false" placeholder="vibeworks.example.de" />
          <div class="error" id="error" role="alert"></div>
          <div class="row">
            <button class="primary" id="connect" type="submit"></button>
          </div>
        </form>
        <p class="hint" id="t-hint"></p>
      </section>

      <section id="offline" hidden>
        <h1 id="t-offTitle"></h1>
        <p id="t-offText"></p>
        <div class="row">
          <button class="primary" id="retry" type="button"></button>
          <button id="change" type="button"></button>
        </div>
      </section>
    </div>
    <script src="setup.js"></script>
  </body>
</html>
