<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="VibeWorks – das selbst gehostete Kontrollzentrum für deine Vibe-Coding-Projekte">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#140f2e"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.22" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.82" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="0.62" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .twinkle { animation: tw 4s ease-in-out infinite; }
      .t2 { animation-delay: 1.3s; } .t3 { animation-delay: 2.6s; }
      @keyframes tw { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
      .drift { animation: drift 14s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translate(0, 0) } to { transform: translate(-40px, 18px) } }
      @media (prefers-reduced-motion: reduce) { .twinkle, .drift { animation: none } }
    </style>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <g class="drift">
    <rect width="1280" height="400" fill="url(#neb1)"/>
    <rect width="1280" height="400" fill="url(#neb3)"/>
  </g>
  <rect width="1280" height="400" rx="28" fill="url(#neb2)"/>

  <!-- Sterne -->
  <g fill="#fff">
    <circle cx="96" cy="62" r="1.4" class="twinkle"/>
    <circle cx="188" cy="318" r="1.1" class="twinkle t2"/>
    <circle cx="402" cy="46" r="1.6" class="twinkle t3"/>
    <circle cx="560" cy="352" r="1.2" class="twinkle"/>
    <circle cx="690" cy="84" r="1" class="twinkle t2"/>
    <circle cx="1210" cy="58" r="1.5" class="twinkle t3"/>
    <circle cx="1160" cy="352" r="1.1" class="twinkle"/>
    <circle cx="40" cy="200" r="1" class="twinkle t3"/>
    <circle cx="640" cy="210" r="0.9" class="twinkle t2"/>
    <circle cx="300" cy="140" r="0.8" opacity=".5"/>
    <circle cx="470" cy="260" r="0.8" opacity=".4"/>
    <circle cx="1240" cy="220" r="0.9" opacity=".5"/>
  </g>

  <!-- Logo und Schriftzug -->
  <g transform="translate(88 118)">
    <rect width="104" height="104" rx="26" fill="#0b0a1f" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M21 33 L41 75 L52 50 L63 75 L83 33" fill="none" stroke="url(#vw)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="83" cy="21" r="4.5" fill="#fff" opacity=".9"/>
  </g>
  <text x="222" y="190" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#text)">VibeWorks</text>
  <text x="226" y="236" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#c4b5fd">Das Kontrollzentrum für deine Vibe-Coding-Projekte</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#e9d5ff">
    <g transform="translate(226 268)">
      <rect width="118" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="59" y="21" text-anchor="middle">selbst gehostet</text>
    </g>
    <g transform="translate(354 268)">
      <rect width="100" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="50" y="21" text-anchor="middle">Git &amp; Issues</text>
    </g>
    <g transform="translate(464 268)">
      <rect width="112" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="56" y="21" text-anchor="middle">eigenes Design</text>
    </g>
  </g>

  <!-- Angedeutetes Board -->
  <g transform="translate(812 70)">
    <rect width="380" height="260" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="26" cy="26" r="5" fill="#f87171" opacity=".8"/>
    <circle cx="44" cy="26" r="5" fill="#fbbf24" opacity=".8"/>
    <circle cx="62" cy="26" r="5" fill="#34d399" opacity=".8"/>
    <g transform="translate(22 52)">
      <rect width="104" height="186" rx="14" fill="#0b0a1f" fill-opacity=".45"/>
      <rect x="10" y="12" width="44" height="7" rx="3.5" fill="#94a3b8" opacity=".6"/>
      <rect x="10" y="32" width="84" height="40" rx="9" fill="#ffffff" fill-opacity=".08"/>
      <rect x="18" y="44" width="56" height="6" rx="3" fill="#e9d5ff" opacity=".7"/>
      <rect x="18" y="56" width="34" height="5" rx="2.5" fill="#a78bfa" opacity=".7"/>
      <rect x="10" y="80" width="84" height="40" rx="9" fill="#ffffff" fill-opacity=".08"/>
      <rect x="18" y="92" width="62" height="6" rx="3" fill="#e9d5ff" opacity=".7"/>
    </g>
    <g transform="translate(138 52)">
      <rect width="104" height="186" rx="14" fill="#0b0a1f" fill-opacity=".45"/>
      <rect x="10" y="12" width="52" height="7" rx="3.5" fill="#a78bfa" opacity=".9"/>
      <rect x="10" y="32" width="84" height="52" rx="9" fill="#8b5cf6" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".5"/>
      <rect x="18" y="44" width="60" height="6" rx="3" fill="#fff" opacity=".85"/>
      <rect x="18" y="58" width="24" height="12" rx="4" fill="#ffffff" fill-opacity=".12"/>
      <rect x="46" y="58" width="30" height="12" rx="4" fill="#ec4899" fill-opacity=".35"/>
    </g>
    <g transform="translate(254 52)">
      <rect width="104" height="186" rx="14" fill="#0b0a1f" fill-opacity=".45"/>
      <rect x="10" y="12" width="46" height="7" rx="3.5" fill="#34d399" opacity=".8"/>
      <rect x="10" y="32" width="84" height="40" rx="9" fill="#ffffff" fill-opacity=".06"/>
      <circle cx="24" cy="52" r="7" fill="#34d399"/>
      <path d="M20.5 52 l2.5 2.5 l4.5 -5" stroke="#0b0a1f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="36" y="49" width="48" height="6" rx="3" fill="#94a3b8" opacity=".6"/>
      <rect x="10" y="80" width="84" height="40" rx="9" fill="#ffffff" fill-opacity=".06"/>
      <circle cx="24" cy="100" r="7" fill="#34d399"/>
      <path d="M20.5 100 l2.5 2.5 l4.5 -5" stroke="#0b0a1f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="36" y="97" width="40" height="6" rx="3" fill="#94a3b8" opacity=".6"/>
    </g>
  </g>
  <circle cx="1080" cy="330" r="60" fill="#ec4899" opacity=".25" filter="url(#soft)"/>
</svg>
